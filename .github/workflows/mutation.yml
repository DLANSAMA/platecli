name: Mutation baseline

# Mutation testing is minutes-to-tens-of-minutes long. It is a regression gate
# on its own cadence — NOT a per-PR blocker (see docs/mutation-baseline.md).
on:
  workflow_dispatch:
  schedule:
    # 06:15 UTC daily; the "changed" job skips the run when main has not moved.
    - cron: "15 6 * * *"

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The nightly run re-tests main only when main changed since the last green
  # baseline: the same commit gives the same score, so most nights there is
  # nothing to do. A manual run always runs. A failed baseline keeps running
  # nightly until one passes.
  changed:
    name: Main changed since the last green baseline
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --workflow mutation.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || last=""
          if [ -n "$last" ] && [ "$last" = "$SHA" ]; then
            echo "main is still $SHA, which already has a green baseline: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is $SHA; last green baseline was ${last:-unknown}: running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Safety-module mutation baseline
    needs: changed
    # A failed "changed" job leaves the output empty, which means run.
    if: ${{ !cancelled() && needs.changed.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # mutmut 3.x requires Python ≥ 3.10
          python-version: "3.12"

      - name: Install package + test extras
        run: |
          uv sync --frozen
          uv pip install '.[test]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run mutation baseline (floor from docs/mutation-baseline.md)
        env:
          # Keep in sync with docs/mutation-baseline.md "CI floor".
          MUTATION_SCORE_FLOOR: "48"
          FORCE_CLEAN: "1"
          CI: "true"
        run: ./scripts/run_mutation_baseline.sh

      - name: Upload mutmut artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutmut-stats.json
          if-no-files-found: ignore

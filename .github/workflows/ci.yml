name: CI

# push is limited to main so PR branches don't run everything twice
# (once for the push, once for the pull_request event).
on:
  push:
    branches: [main]
  # ready_for_review is listed because draft PRs skip the test matrix: it runs
  # once, when the PR is marked ready, not on every push while it is a draft.
  # Lint still runs on drafts (see the lint job).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Weekly drift detector: firmware, the Printables GraphQL API, OrcaSlicer
  # flags and new CVEs (pip-audit) all move without a commit in this repo.
  schedule:
    # 07:00 UTC Mondays (mutation.yml already owns 06:15 daily).
    - cron: "0 7 * * 1"
  # Called by release.yml so a tag cannot publish unless this matrix is green
  # on the tagged commit. Keep this trigger — release.yml depends on it.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A squash merge whose tree is byte-identical to the PR head it came from
  # was already tested: the ruleset only lets a PR merge once all six required
  # checks passed on that head. Re-running the matrix on main would test the
  # same files again. Any other push (a merge onto a main that moved, a commit
  # without "(#N)") is tested. Only branch pushes are checked; release.yml
  # calls this workflow from a tag push, and the release gate always runs.
  # Uses git alone (contents: read), since release.yml grants nothing more.
  merged:
    name: Skip if this merge was already tested
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      already-tested: ${{ steps.compare.outputs.already-tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: compare
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pr=$(printf '%s\n' "$MESSAGE" | head -n 1 | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
          if [ -z "$pr" ]; then
            echo "No (#N) in the commit subject: testing."
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "refs/pull/$pr/head"; then
            echo "Could not fetch PR #$pr: testing."
            exit 0
          fi
          merged_tree=$(git rev-parse 'HEAD^{tree}') || merged_tree=""
          tested_tree=$(git rev-parse 'FETCH_HEAD^{tree}') || tested_tree=""
          if [ -n "$merged_tree" ] && [ "$merged_tree" = "$tested_tree" ]; then
            echo "Same tree as PR #$pr's head, which passed the required checks: skipping."
            echo "already-tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tree differs from PR #$pr's head (main moved under it): testing."
          fi

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: merged
    # Runs unless the PR is a draft or the merge was already tested. A failed
    # or skipped "merged" job leaves the output empty, which means test. A
    # skipped matrix job reports its unexpanded name, so a draft never shows
    # the six required check names as passed.
    if: >-
      ${{ !cancelled()
          && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
          && needs.merged.outputs.already-tested != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python coverage on Linux; one job each on macOS and Windows at
        # the newest Python. Those runners start slower (and bill at 10x / 2x
        # if the repo is ever private; public-repo runners are free).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        shell: bash
        run: |
          uv sync --frozen
          # Seed pip into the uv-created venv: `uv sync` does not install pip, but
          # the "Wheel install smoke" / "Source distribution smoke" steps invoke
          # `python -m pip` and `python -m build`.
          uv pip install pip
          # Put the venv on PATH for later steps. uv places entry-point scripts in
          # .venv/Scripts on Windows and .venv/bin elsewhere. The previous form only
          # handled bin and, under the default Windows pwsh shell, silently no-op'd
          # (`>> $GITHUB_PATH` is not `$env:GITHUB_PATH` in pwsh), leaving Windows on
          # the base interpreter without the installed package. shell: bash + RUNNER_OS
          # makes activation work on every runner.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi


      # Single runner: pytest (includes former unittest modules via collection).
      - name: Pytest with coverage
        run: |
          uv pip install '.[test]'
          python -W error::ResourceWarning -m pytest tests/ -m "not live" --cov=bambu_cli --cov-report=term-missing --cov-fail-under=92
      - name: Syntax smoke
        # Auto-discovers bambu_cli/**/*.py (see scripts/syntax_smoke.py).
        run: python scripts/syntax_smoke.py

      - name: CI workflow smoke
        run: python tests/ci_workflow_smoke.py

      - name: Clean generated artifacts before release readiness
        run: |
          # root.rglob('__pycache__')
          # bambu_cli.egg-info
          # 'build', 'dist', 'wheelhouse'
          python scripts/clean_artifacts.py

      - name: Release readiness smoke
        run: python tests/release_readiness_smoke.py

      - name: Python compatibility smoke
        run: python tests/python_compat_smoke.py

      - name: Dependency resolution smoke
        run: python tests/dependency_resolution_smoke.py

      - name: Privacy smoke
        run: python tests/privacy_smoke.py

      - name: CLI help smoke tests
        # Subcommands derived from build_parser() (see scripts/cli_help_smoke.py).
        run: |
          python scripts/cli_help_smoke.py
          plate --help
          plate --version

      - name: Installed CLI agent smoke
        env:
          BAMBU_CLI: plate
        run: python tests/agent_cli_smoke.py

      - name: Wheel install smoke
        env:
          BAMBU_CLI: plate
        run: |
          python -m pip wheel . -w wheelhouse
          python -m pip install --force-reinstall --no-deps --no-index --find-links wheelhouse platecli
          plate --help
          python tests/agent_cli_smoke.py

      - name: Source distribution smoke
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist
          python tests/package_contents_smoke.py
          python tests/python_compat_smoke.py
          python tests/privacy_smoke.py --include-dist

  lint:
    name: Lint (ruff + bandit)
    needs: merged
    # Not skipped on drafts: a skipped job reports success under this fixed
    # name, which is a required check, and could sit beside a real failure on
    # the same commit. Lint is one quick Linux job; the matrix is the cost.
    if: ${{ !cancelled() && needs.merged.outputs.already-tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Lint tool versions are pinned so a new upstream release cannot red a
      # contributor's unrelated PR. Bump deliberately (and fix the new findings
      # in that same PR). Keep AGENTS.md / CONTRIBUTING.md notes in sync.
      - name: ruff (blocking, correctness rules only)
        run: uvx ruff@0.16.0 check bambu_cli
      - name: ruff format (blocking, style consistency)
        run: uvx ruff@0.16.0 format --check bambu_cli
      - name: bandit (blocking medium+)
        run: uvx bandit@1.9.4 -c pyproject.toml -r bambu_cli -ll
      - name: pip-audit (blocking high+)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > audit-requirements.txt
          uvx pip-audit@2.10.1 -r audit-requirements.txt
      - name: mypy (blocking; full bambu_cli package, check_untyped_defs)
        run: uvx mypy@2.3.0 -p bambu_cli
      - name: no test-awareness in production code (blocking)
        run: |
          if grep -rnE 'isinstance\([^)]*\bMock\b|["'"'"']unittest["'"'"'] in sys\.modules|^\s*(import|from)\s+(unittest|pytest|mock)\b' bambu_cli/; then
            echo "::error::Test-awareness branch found in production code (see docs/test-backlog.md ground rules)."
            exit 1
          fi
      - name: sys.exit only at CLI entry (blocking)
        run: |
          if grep -rnE 'sys\.exit\(' bambu_cli/ | grep -v 'bambu_cli/cli.py' | grep -v 'bambu_cli/errors.py'; then
            echo "::error::sys.exit found outside cli entry (domain code must raise BambuError/abort)."
            exit 1
          fi
      - name: no mockable decorator (blocking)
        run: |
          if grep -rnE '@mockable|def mockable' bambu_cli/; then
            echo "::error::@mockable/test indirection found in production code."
            exit 1
          fi
      - name: JSON schemas match their contracts (blocking)
        # docs/schemas/*.json is generated from bambu_cli/contracts/. This is
        # the anti-drift gate: edit a payload, regenerate, commit both.
        #
        # Pinned to 3.12 on purpose. The generator needs 3.10+ to evaluate the
        # contracts' `X | None` annotations, and pydantic is only installed
        # above that floor (see the marker in pyproject). The package requires
        # Python >=3.10 — that floor is covered by the test matrix.
        run: uv run --python 3.12 --with pydantic python scripts/gen_schemas.py --check
      - name: layer boundaries (blocking)
        # Directories alone never held: protocols/, slicer/ and download/ already
        # existed as packages and still drifted (slicer imported a private FTPS
        # helper). See the rank table in scripts/check_layers.py.
        run: python scripts/check_layers.py
      - name: security + contract markers smoke
        run: |
          uv sync --frozen
          uv pip install '.[test]'
          uv run python -m pytest tests/ -q -m "security or contract" --tb=line
name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can — it speeds up diagnosis significantly.

        **Before you file:** many connection, slicing, and camera problems are covered in the [troubleshooting guide](https://github.com/DLANSAMA/platecli/blob/main/docs/troubleshooting.md) — it is keyed by the error message. Running `plate doctor` and `plate preflight` first also makes the report much easier to act on.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect to happen, and what actually happened?
      placeholder: "Example: plate job ... exited with an error instead of uploading the file."
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command run
      description: Paste the full command you ran (redact your access code if it appears).
      render: shell
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: printer
    attributes:
      label: Printer model
      options:
        - P1P
        - P1S
        - X1C
        - X1E
        - A1
        - A1 Mini
        - Other / none (not printer-related)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: platecli version
      description: Run `plate --version` and paste the output here.
      placeholder: "plate X.Y.Z"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`plate doctor --json` output"
      description: |
        Run `plate doctor --json` and paste the output. Serial, access code, and your printer's LAN IP are redacted automatically in `--json` mode — but double-check before submitting that no access code or LAN address appears in plain text. Do not add `-v`/`--verbose`: that un-redacts your printer's IP.

        One field is **not** redacted: `certificate_fingerprint`. It is kept in full because that is how you (or an agent) pin the connection, and it reveals nothing about your network. It is, however, a value unique to your printer — if you would rather not publish it, truncate it to the first 8 characters before pasting.
      render: json
    validations:
      required: false
